<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>SMILE The Stack 15s</title>
<script src="vendor/gsap.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:#0B1220; }
  #root { position:relative; width:100%; height:100%; overflow:hidden; background:#0B1220; }
  .fill { position:absolute; left:0; top:0; width:1080px; height:1920px; }
  .sc { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:hidden; }
  svg { display:block; }
  /* NO on-screen text anywhere in this piece. Top-left corner (x<240, y<230) is kept plain for the logo. */
</style>
</head>
<body>
<div id="root" data-composition-id="smile-stack" data-start="0" data-duration="15" data-width="1080" data-height="1920">
  <div id="s1" class="fill clip" data-start="0"  data-duration="3" data-track-index="1"><div class="sc"></div></div>
  <div id="s2" class="fill clip" data-start="3"  data-duration="4" data-track-index="1"><div class="sc"></div></div>
  <div id="s3" class="fill clip" data-start="7"  data-duration="4" data-track-index="1"><div class="sc"></div></div>
  <div id="s4" class="fill clip" data-start="11" data-duration="4" data-track-index="1"><div class="sc"></div></div>
  <div id="fx"  class="fill clip" data-start="0"  data-duration="15" data-track-index="6" style="pointer-events:none"></div>
  <audio id="a-sound" data-start="0" data-duration="15" data-track-index="10" data-volume="1" src="assets/sound.mp3"></audio>
</div>

<script>
(function(){
  function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
  var rnd=mulberry(70811), R=function(a,b){return a+(b-a)*rnd();};
  var tl=gsap.timeline({paused:true});
  var $=function(s){return document.querySelector(s)};
  function box(parent,cls,style,inner){var d=document.createElement('div');d.className=cls||'';d.style.cssText='position:absolute;'+(style||'');if(inner)d.innerHTML=inner;parent.appendChild(d);return d;}
  function set(el,o){gsap.set(el,o);return el;}
  var SKIN='#E2B592', SKIND='#C48D69', NAVY='#26354F';

  // Asian professional vector avatar
  function person(o){
    var skin=o.skin||'#f0c8a0', sd=o.skinD||'#dba67f', hair=o.hair||'#15151c', shirt=o.shirt||'#1d3b66', fem=!!o.fem, gl=!!o.glasses, tie=o.tie;
    var back = fem ? '<path d="M56 112 C44 48 156 48 144 112 L152 196 L48 196Z" fill="'+hair+'"/>' : '';
    var front = fem
      ? '<path d="M62 108 C60 62 84 52 102 52 C128 52 142 70 138 108 C128 84 112 74 98 76 C82 76 68 88 62 108Z" fill="'+hair+'"/>'
      : '<path d="M60 106 C54 56 82 46 102 46 C130 46 148 62 140 106 C136 86 124 76 104 74 C86 74 68 82 60 106Z" fill="'+hair+'"/>';
    var glasses = gl ? '<g fill="none" stroke="#222a38" stroke-width="3"><rect x="70" y="102" width="26" height="20" rx="8"/><rect x="104" y="102" width="26" height="20" rx="8"/><path d="M96 111h8"/></g>' : '';
    var tieSvg = tie ? '<path d="M100 182l-7 12 7 30 7-30z" fill="'+tie+'"/>' : '';
    return '<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">'
      + back
      + '<path d="M14 250 C14 196 56 178 100 178 C144 178 186 196 186 250Z" fill="'+shirt+'"/>'
      + '<path d="M84 178 L100 206 L116 178Z" fill="#f4f7fb"/>' + tieSvg
      + '<rect x="87" y="148" width="26" height="34" rx="10" fill="'+sd+'"/>'
      + '<ellipse cx="100" cy="112" rx="38" ry="46" fill="'+skin+'"/>'
      + '<ellipse cx="62" cy="116" rx="5" ry="9" fill="'+skin+'"/><ellipse cx="138" cy="116" rx="5" ry="9" fill="'+skin+'"/>'
      + front
      + '<path d="M76 100 q8 -5 17 -1 M107 99 q9 -4 17 1" stroke="#15151c" stroke-width="3.2" fill="none" stroke-linecap="round"/>'
      + '<ellipse cx="84" cy="113" rx="6.4" ry="2.8" fill="#1a1a22"/><ellipse cx="116" cy="113" rx="6.4" ry="2.8" fill="#1a1a22"/>'
      + glasses
      + '<path d="M100 118 q-3 9 2 11" stroke="'+sd+'" stroke-width="2.6" fill="none" stroke-linecap="round"/>'
      + '<path d="M86 136 Q100 148 114 136" stroke="#b4574c" stroke-width="3.6" fill="none" stroke-linecap="round"/>'
      + '<ellipse cx="74" cy="132" rx="8" ry="4" fill="#ff8f8f" opacity=".28"/><ellipse cx="126" cy="132" rx="8" ry="4" fill="#ff8f8f" opacity=".28"/>'
      + '</svg>';
  }
  var P = {
    hr:     {fem:true,  shirt:'#0e4471', skin:'#f1cba6', skinD:'#dcab85'},
    hrM:    {fem:false, shirt:'#16365c', skin:'#eebf95', skinD:'#d6a077', tie:'#1e8fff', glasses:true},
    c1:     {fem:true,  shirt:'#2a6fb5', skin:'#f3d0ac', skinD:'#deb089'},
    c2:     {fem:false, shirt:'#3b4f73', skin:'#ecc196', skinD:'#d4a278'},
    c3:     {fem:true,  shirt:'#1f5f8b', skin:'#efc59d', skinD:'#d9a77f', hair:'#241a1a'},
    c4:     {fem:false, shirt:'#244e7a', skin:'#f0c9a2', skinD:'#d9a981', glasses:true},
    m1:     {fem:true,  shirt:'#0e4471', skin:'#f2cda8', skinD:'#ddb08a'},
    m2:     {fem:false, shirt:'#1a3a60', skin:'#edc29a', skinD:'#d5a47c', tie:'#4fe3ff'}
  };
  function av(parent,k,x,y,w,extra){
    var h=w*1.25; var d=box(parent,'av','left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;'+(extra||''),person(P[k])); return d;
  }


  function neutral(svg){ return svg.replace('M86 136 Q100 148 114 136','M89 141 Q100 141 111 141').replace(/<ellipse cx="74" cy="132"[^>]*\/><ellipse cx="126" cy="132"[^>]*\/>/,''); }

  /* ---- gentle handheld drift (shots 1, 2, 4); shot 3 is locked off ---- */
  function drift(k,start,dur,ax,ay,ar){
    var el=$('#'+k+' .sc'); set(el,{transformOrigin:'50% 50%'});
    var n=Math.max(2,Math.round(dur/0.9));
    for(var i=0;i<n;i++){
      tl.to(el,{x:(i%2?-1:1)*ax*(0.6+0.4*rnd()),y:(i%3?1:-1)*ay*(0.6+0.4*rnd()),rotation:(i%2?-1:1)*ar,duration:dur/n,ease:'sine.inOut'},start+i*dur/n);
    }
  }

  /* ---- hands (vector, skin-toned, soft shading) ---- */
  function handTop(){ // right hand seen from above, pinching a sheet; origin = fingertips pinch point
    return '<svg width="640" height="320" viewBox="-460 -160 640 320" style="overflow:visible">'
     +'<defs><linearGradient id="sk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9BE9B"/><stop offset="1" stop-color="#C98F6A"/></linearGradient>'
     +'<linearGradient id="sl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1D2A41"/><stop offset="1" stop-color="#2E4062"/></linearGradient></defs>'
     +'<rect x="-460" y="-92" width="330" height="184" rx="30" fill="url(#sl)"/>'
     +'<rect x="-168" y="-70" width="60" height="140" rx="14" fill="#F2F4F8"/>'
     +'<path d="M-130 -62 C-90 -92 -20 -96 10 -70 L12 70 C-30 96 -100 94 -130 62Z" fill="url(#sk)" stroke="#BE855F" stroke-width="2"/>'
     +[[-70,0],[-35,6],[-4,10],[26,14]].map(function(f,i){var y=f[0],r=f[1];return '<rect x="-4" y="'+(y-19)+'" width="'+(150-i*9)+'" height="34" rx="17" fill="url(#sk)" stroke="#BE855F" stroke-width="2" transform="rotate('+(r*0.4)+' 0 '+y+')"/>';}).join('')
     +'<rect x="-30" y="48" width="118" height="38" rx="19" fill="url(#sk)" stroke="#BE855F" stroke-width="2" transform="rotate(-16 -30 56)"/>'
     +'</svg>';
  }
  function sheetSVG(w,h,k){
    var o='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><rect width="'+w+'" height="'+h+'" rx="5" fill="#FFFFFF"/>'
     +'<rect x="'+(w*0.09)+'" y="'+(h*0.07)+'" width="'+(w*0.2)+'" height="'+(w*0.2)+'" rx="6" fill="#D5DCE6"/>';
    for(var i=0;i<4;i++) o+='<rect x="'+(w*0.35)+'" y="'+(h*0.075+i*h*0.04)+'" width="'+(w*(0.5-(i%2)*0.14))+'" height="'+(h*0.022)+'" rx="4" fill="#CBD3DE"/>';
    for(var j=0;j<9;j++) o+='<rect x="'+(w*0.09)+'" y="'+(h*(0.34+j*0.06))+'" width="'+(w*((j%4===3)?0.46:0.82))+'" height="'+(h*0.02)+'" rx="4" fill="#D3DAE4"/>';
    return o+'</svg>';
  }

  /* ======================= SHOT 1 · 0:00–0:03 · ECU thumb scrolling ======================= */
  (function(){
    var S=$('#s1 .sc'), T=0;
    box(S,'','inset:0;background:linear-gradient(180deg,#E3ECF5 0%,#C9D8E8 38%,#A9B8C9 100%);');
    // out-of-focus office behind her: glass partition, window bloom
    var bgb=box(S,'','inset:0;filter:blur(26px);');
    box(bgb,'','left:520px;top:-40px;width:640px;height:760px;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0));');
    box(bgb,'','left:300px;top:120px;width:12px;height:900px;background:rgba(150,172,198,.7);');
    box(bgb,'','left:80px;top:520px;width:300px;height:300px;border-radius:50%;background:rgba(63,120,86,.35);');
    // face (soft focus), large, centre-right; glasses reflect moving white rows
    var W=700, s=W/200;
    var face=box(S,'','left:360px;top:230px;width:'+W+'px;height:'+(W*1.25)+'px;filter:blur(7px);');
    face.innerHTML=neutral(person({fem:true,glasses:true,shirt:'#2C3E5E',skin:'#E8BE9C',skinD:'#CFA07C'}));
    [[70,102],[104,102]].forEach(function(l){
      var lens=box(face,'','left:'+(l[0]*s)+'px;top:'+(l[1]*s)+'px;width:'+(26*s)+'px;height:'+(20*s)+'px;border-radius:'+(8*s)+'px;overflow:hidden;background:rgba(232,242,252,.85);');
      var rows=box(lens,'','left:0;top:0;width:100%;height:'+(20*s*3)+'px;');
      for(var i=0;i<14;i++) box(rows,'','left:'+(3*s)+'px;top:'+(i*5.2*s)+'px;width:'+((i%3===2?14:20)*s)+'px;height:'+(2.6*s)+'px;border-radius:'+(s)+'px;background:#fff;box-shadow:0 0 '+(s*1.5)+'px rgba(120,150,200,.6);');
      tl.fromTo(rows,{y:0},{y:-(5.2*s*5),duration:.55,ease:'none',repeat:5},T);
    });
    // laptop deck + trackpad (sharp, foreground)
    var deck=box(S,'','left:-40px;top:1180px;width:1160px;height:800px;background:linear-gradient(180deg,#D2D8E0 0%,#B7BFCA 100%);border-radius:40px 40px 0 0;box-shadow:0 -20px 60px rgba(30,50,80,.28);');
    box(deck,'','left:0;top:0;width:100%;height:10px;background:rgba(255,255,255,.7);');
    var pad=box(deck,'','left:300px;top:150px;width:600px;height:400px;border-radius:30px;background:linear-gradient(180deg,#C5CCD6,#D8DEE6);box-shadow:inset 0 3px 8px rgba(255,255,255,.75),inset 0 -3px 10px rgba(40,60,90,.25);');
    // thumb
    var thumb=box(S,'','left:560px;top:1470px;width:300px;height:560px;');
    thumb.innerHTML='<svg width="300" height="560" viewBox="0 0 300 560" style="overflow:visible"><defs><linearGradient id="th" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EBC1A0"/><stop offset=".6" stop-color="#DDAB86"/><stop offset="1" stop-color="#C48D69"/></linearGradient></defs>'
      +'<g transform="rotate(-20 150 300)"><rect x="52" y="0" width="196" height="640" rx="98" fill="url(#th)" stroke="#B98059" stroke-width="2"/>'
      +'<rect x="86" y="18" width="128" height="104" rx="46" fill="#F3D9C7" opacity=".92"/><rect x="98" y="28" width="46" height="34" rx="17" fill="#fff" opacity=".35"/>'
      +'<path d="M70 168 q80 18 160 0" stroke="#C48D69" stroke-width="3" fill="none" opacity=".5"/><path d="M70 196 q80 16 160 0" stroke="#C48D69" stroke-width="2" fill="none" opacity=".35"/></g></svg>';
    // scroll strokes: continuous, never stops
    for(var i=0;i<6;i++){
      tl.to(thumb,{y:-58,x:8,duration:.34,ease:'power1.out'},T+i*.5);
      tl.to(thumb,{y:0,x:0,duration:.16,ease:'power1.in'},T+i*.5+.34);
    }
    // laptop glow on her hand
    box(S,'','left:0;top:1180px;width:1080px;height:420px;background:linear-gradient(180deg,rgba(214,232,255,.34),rgba(214,232,255,0));');
    tl.fromTo(S,{scale:1.06},{scale:1.0,duration:3,ease:'none',transformOrigin:'60% 70%'},T);
  })();

  /* ======================= SHOT 2 · 0:03–0:07 · top-down, the stack grows ======================= */
  (function(){
    var S=$('#s2 .sc'), T=3;
    box(S,'','inset:0;background:linear-gradient(160deg,#EDE7DB 0%,#E2DACB 55%,#D3CAB9 100%);');
    for(var i=0;i<26;i++) box(S,'','left:0;top:'+(i*76+R(0,30))+'px;width:1080px;height:2px;background:rgba(150,128,96,'+R(.04,.09).toFixed(2)+');');
    // pens + sticky pad (clutter, low contrast)
    box(S,'','left:120px;top:1260px;width:210px;height:210px;border-radius:6px;background:#F4D56B;box-shadow:0 12px 24px rgba(90,70,30,.25);transform:rotate(-7deg);');
    box(S,'','left:380px;top:1380px;width:300px;height:14px;border-radius:7px;background:#2B4F86;transform:rotate(18deg);box-shadow:0 6px 10px rgba(60,50,30,.3);');
    // laptop keyboard deck at the bottom
    var kb=box(S,'','left:60px;top:1620px;width:960px;height:420px;border-radius:30px;background:linear-gradient(180deg,#CBD1DA,#B5BDC8);box-shadow:0 -14px 40px rgba(40,50,70,.25);');
    for(var r=0;r<4;r++) for(var c=0;c<12;c++) box(kb,'','left:'+(34+c*74)+'px;top:'+(34+r*58)+'px;width:62px;height:46px;border-radius:9px;background:#5B6470;opacity:.8;');
    // her head from above (top-right), dark hair
    var head=box(S,'','left:690px;top:-210px;width:540px;height:470px;border-radius:50%;background:radial-gradient(circle at 40% 70%,#3A3033,#171315 70%);box-shadow:0 30px 60px rgba(0,0,0,.25);');
    box(head,'','left:150px;top:300px;width:230px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),rgba(255,255,255,0));');
    // sheet stack (centre-right)
    var SX=700, SY=1050, SW=300, SH=420;
    var shadow=box(S,'','left:'+(SX-SW/2)+'px;top:'+(SY-SH/2)+'px;width:'+SW+'px;height:'+SH+'px;border-radius:8px;background:rgba(40,30,20,.42);filter:blur(16px);transform:translate(8px,12px);');
    function place(parent,x,y,rot,i){
      var d=box(parent,'','left:'+(x-SW/2)+'px;top:'+(y-SH/2)+'px;width:'+SW+'px;height:'+SH+'px;transform:rotate('+rot+'deg);box-shadow:0 '+(4+i)+'px '+(8+i*1.5)+'px rgba(40,30,20,.30);border-radius:5px;',sheetSVG(SW,SH));
      return d;
    }
    for(var k=0;k<5;k++) place(S,SX+R(-8,8),SY+R(-8,8),R(-3.2,3.2),k);
    // accelerating placements: one, another, another, faster…
    var TS=[0.12,0.78,1.28,1.66,1.96,2.2,2.4,2.56,2.7,2.82,2.93,3.03,3.12,3.20];
    var DU=[0.52,0.40,0.32,0.26,0.22,0.19,0.17,0.15,0.14,0.13,0.12,0.12,0.11,0.11];
    TS.forEach(function(t0,i){
      var fx=SX+R(-12,12), fy=SY+R(-12,12), fr=R(-3.6,3.6);
      var g=box(S,'','left:'+(fx-SW/2)+'px;top:'+(fy-SH/2)+'px;width:'+SW+'px;height:'+SH+'px;');
      var sh=box(g,'','left:0;top:0;width:'+SW+'px;height:'+SH+'px;border-radius:5px;box-shadow:0 '+(6+i)+'px '+(10+i*1.6)+'px rgba(40,30,20,.32);',sheetSVG(SW,SH));
      var hand=box(g,'','left:-454px;top:'+(SH*0.30-160)+'px;width:640px;height:320px;');
      hand.innerHTML=handTop();
      set(g,{opacity:0,x:-560,rotation:fr-7});
      tl.to(g,{opacity:1,duration:.06},T+t0);
      tl.to(g,{x:0,rotation:fr,duration:DU[i],ease:'power3.out'},T+t0);
      tl.to(hand,{x:-420,opacity:0,duration:Math.max(.12,DU[i]*0.7),ease:'power2.in'},T+t0+DU[i]);
      // the stack's shadow deepens as it grows
      tl.to(shadow,{x:12+i*2.2,y:16+i*3,scale:1+i*.006,duration:.1},T+t0+DU[i]);
    });
    // her other hand presses her forehead
    var fh=box(S,'','left:560px;top:-80px;width:560px;height:400px;');
    fh.innerHTML='<svg width="560" height="400" viewBox="0 0 560 400" style="overflow:visible"><defs><linearGradient id="fk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9BE9B"/><stop offset="1" stop-color="#C98F6A"/></linearGradient></defs>'
      +'<rect x="330" y="120" width="320" height="170" rx="28" fill="#2A3B5A"/>'
      +'<path d="M340 130 C300 100 220 110 160 150 C130 175 130 230 170 258 C230 286 320 276 342 252Z" fill="url(#fk)" stroke="#BE855F" stroke-width="2"/>'
      +[[130,170],[100,198],[96,228],[110,258]].map(function(f){return '<rect x="'+(f[0]-70)+'" y="'+(f[1]-16)+'" width="130" height="32" rx="16" fill="url(#fk)" stroke="#BE855F" stroke-width="2"/>';}).join('')
      +'</svg>';
    set(fh,{opacity:0,x:260});
    tl.to(fh,{opacity:1,x:0,duration:.55,ease:'power3.out'},T+2.95);
    drift('s2',T,4,5,4,.25);
  })();

  /* ======================= SHOT 3 · 0:07–0:11 · static wide, dusk, stillness ======================= */
  (function(){
    var S=$('#s3 .sc'), T=7;
    box(S,'','inset:0;background:linear-gradient(180deg,#0A1530 0%,#14284B 34%,#1B2F52 52%,#0D1527 100%);');
    // blue-hour windows with generic soft city lights (no landmarks)
    var win=box(S,'','left:0;top:300px;width:1080px;height:620px;filter:blur(3px);');
    box(win,'','inset:0;background:linear-gradient(180deg,#27487C 0%,#3A5F95 55%,#20375F 100%);opacity:.8;');
    for(var i=0;i<46;i++) box(win,'','left:'+R(0,1060)+'px;top:'+R(300,590)+'px;width:'+R(5,14)+'px;height:'+R(5,14)+'px;border-radius:50%;background:rgba(255,226,160,'+R(.25,.7).toFixed(2)+');filter:blur(2px);');
    for(var m=0;m<=1080;m+=180) box(S,'','left:'+m+'px;top:300px;width:8px;height:620px;background:rgba(10,20,44,.7);');
    box(S,'','left:0;top:600px;width:1080px;height:8px;background:rgba(10,20,44,.6);');
    // far desks / chairs in silhouette
    for(var d=0;d<5;d++){
      box(S,'','left:'+(60+d*210)+'px;top:'+(1000+(d%2)*26)+'px;width:170px;height:12px;background:#0B1424;border-radius:4px;');
      box(S,'','left:'+(86+d*210)+'px;top:'+(930+(d%2)*26)+'px;width:104px;height:70px;border-radius:14px 14px 4px 4px;background:#0E182B;');
    }
    box(S,'','left:0;top:1120px;width:1080px;height:800px;background:linear-gradient(180deg,#0F1A2E,#070C18);');
    // her desk, centre-right
    box(S,'','left:300px;top:1180px;width:700px;height:20px;border-radius:6px;background:#26334A;');
    box(S,'','left:332px;top:1200px;width:14px;height:330px;background:#18233A;');
    box(S,'','left:954px;top:1200px;width:14px;height:330px;background:#18233A;');
    // tall stacks of printed resumes on the desk
    [[360,1040,120,140],[498,1010,120,170],[880,1060,110,120]].forEach(function(p,i){
      var st=box(S,'','left:'+p[0]+'px;top:'+p[1]+'px;width:'+p[2]+'px;height:'+p[3]+'px;');
      for(var j=0;j<10;j++) box(st,'','left:'+R(-3,3)+'px;top:'+(p[3]-14-j*(p[3]/10.5))+'px;width:'+p[2]+'px;height:'+(p[3]/10.5+4)+'px;background:#C9D3E3;border-top:2px solid #F0F4FA;border-radius:2px;opacity:.9;');
    });
    // woman seated behind the laptop, lit only by her screen
    var wp=box(S,'','left:612px;top:900px;width:260px;height:325px;');
    wp.innerHTML=neutral(person({fem:true,glasses:true,shirt:'#2C3E5E',skin:'#E8BE9C',skinD:'#CFA07C'}));
    var lit=box(S,'','left:612px;top:900px;width:260px;height:325px;background:radial-gradient(closest-side at 50% 78%,rgba(205,225,255,.00),rgba(6,12,28,.62) 100%);mix-blend-mode:multiply;');
    box(S,'','left:612px;top:900px;width:260px;height:325px;background:radial-gradient(closest-side at 50% 62%,rgba(190,220,255,.30),rgba(190,220,255,0));mix-blend-mode:screen;');
    // laptop (back of lid toward us) with screen glow on the desk
    var glow=box(S,'','left:430px;top:1060px;width:640px;height:340px;background:radial-gradient(closest-side,rgba(190,220,255,.46),rgba(190,220,255,0));');
