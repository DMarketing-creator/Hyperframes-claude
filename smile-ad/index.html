<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --navy:#0e4471; --deep:#06223b; --ink:#04162a; --electric:#1e8fff; --cyan:#4fe3ff; --white:#ffffff;
    --glass:rgba(255,255,255,.09); --glassb:rgba(255,255,255,.22);
  }
  html, body { width:1920px; height:1080px; overflow:hidden; background:#04162a; }
  body { font-family: Inter, sans-serif; color:#fff; }
  #root { position:relative; width:100%; height:100%; overflow:hidden; background:#04162a; }
  .abs { position:absolute; }
  .fill { position:absolute; left:0; top:0; width:1920px; height:1080px; }
  .sc { position:absolute; left:0; top:0; width:1920px; height:1080px; }

  /* type */
  .h1 { font-size:92px; font-weight:800; letter-spacing:-1.5px; line-height:1.04; }
  .h2 { font-size:76px; font-weight:800; letter-spacing:-1px; line-height:1.06; }
  .sub { font-size:40px; font-weight:600; color:var(--cyan); letter-spacing:.2px; }
  .tag { font-size:26px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--cyan); }
  .foot { font-size:18px; color:rgba(255,255,255,.55); }

  .glass { background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05)); border:1.5px solid var(--glassb); border-radius:26px; backdrop-filter:blur(6px); box-shadow:0 20px 60px rgba(0,10,40,.45), inset 0 0 40px rgba(79,227,255,.05); }
  .paper { background:#fff; border-radius:10px; box-shadow:0 14px 30px rgba(0,0,0,.35); overflow:hidden; }
  .bar { height:10px; border-radius:6px; background:#cfd8e3; }
  .bar.dk { background:rgba(255,255,255,.28); }
  .bar.bl { background:var(--electric); }
  .bar.cy { background:var(--cyan); }
  .pill { display:inline-block; padding:8px 20px; border-radius:40px; font-size:22px; font-weight:700; }
  .glow { box-shadow:0 0 40px rgba(30,143,255,.7), 0 0 90px rgba(79,227,255,.35); }

  /* laptop */
  .lap { position:absolute; width:1240px; height:820px; }

  .lap .notch { position:absolute; left:500px; top:0; width:240px; height:10px; background:#243b57; border-radius:0 0 10px 10px; }
  .dash .side { position:absolute; left:0; top:0; width:84px; height:100%; background:rgba(0,0,0,.28); }
  .dash .dot { position:absolute; left:26px; width:32px; height:32px; border-radius:10px; background:rgba(255,255,255,.28); }
  .dash .top { position:absolute; left:110px; top:26px; width:1020px; height:44px; border-radius:12px; background:rgba(255,255,255,.1); }
  .dash .st { position:absolute; top:96px; width:316px; height:150px; border-radius:18px; background:rgba(255,255,255,.12); border:1.5px solid rgba(79,227,255,.35); padding:20px 24px; }
  .dash .st b { display:block; font-size:62px; font-weight:800; margin-top:6px; }
  .dash .st span { font-size:22px; color:rgba(255,255,255,.75); font-weight:600; }

  .dash .col { position:absolute; bottom:28px; width:46px; border-radius:8px 8px 2px 2px; background:linear-gradient(var(--cyan),var(--electric)); }
  .dash .list { position:absolute; left:754px; top:272px; width:376px; height:360px; border-radius:18px; background:rgba(255,255,255,.1); }
  .dash .row { position:absolute; left:20px; width:336px; height:64px; border-radius:12px; background:rgba(255,255,255,.12); }
  .dash .row i { position:absolute; left:12px; top:12px; width:40px; height:40px; border-radius:50%; background:var(--electric); }
  .dash .row u { position:absolute; left:66px; top:16px; width:150px; height:10px; border-radius:6px; background:rgba(255,255,255,.55); }
  .dash .row s { position:absolute; left:66px; top:36px; width:100px; height:8px; border-radius:6px; background:rgba(255,255,255,.28); }

  /* phone */
  .phone { position:absolute; width:420px; height:820px; border-radius:62px; background:#08121f; border:6px solid #3d5c80; box-shadow:0 0 100px rgba(30,143,255,.5); }
  .phone .pscr { position:absolute; left:16px; top:16px; right:16px; bottom:16px; border-radius:48px; overflow:hidden; background:linear-gradient(170deg,#0e4471,#04162a); }
  .wave { position:absolute; bottom:0; width:9px; border-radius:6px; background:linear-gradient(var(--cyan),var(--electric)); }

  .pt .brand i { position:absolute; left:62px; top:30px; font-style:normal; font-size:13px; color:#5d7691; }
  .pt .nav { position:absolute; left:14px; width:208px; height:44px; border-radius:12px; font-size:16px; font-weight:700; padding:12px 0 0 52px; color:#27496d; }

  .pt .nav.on { background:#e3edf9; border-left:4px solid #f5a623; }

  .pt .mn { position:absolute; left:262px; top:0; right:0; bottom:0; }
  .pt h4 { position:absolute; left:0; top:34px; font-size:40px; font-weight:800; color:#0d3b66; }
  .pt .ps { position:absolute; left:0; top:88px; font-size:17px; color:#4b6580; }
  .pt .btn { position:absolute; top:44px; height:46px; border-radius:12px; font-size:16px; font-weight:800; padding:13px 22px; }
  .pt .kp { position:absolute; top:150px; width:166px; height:156px; border-radius:14px; background:#fff; border:1px solid #e1e8f0; box-shadow:0 4px 14px rgba(13,59,102,.08); padding:14px 14px; }
  .pt .kp span { display:block; font-size:12px; font-weight:800; letter-spacing:.6px; color:#4b6580; }
  .pt .kp b { display:block; font-size:36px; font-weight:800; margin-top:4px; }
  .pt .kp em { display:block; font-style:normal; font-size:13px; color:#5d7691; line-height:1.25; }
  .pt .kp u { position:absolute; left:14px; bottom:12px; text-decoration:none; font-size:12px; font-weight:800; color:#7a4a00; background:#fff1d6; border-radius:14px; padding:4px 12px; }
  .pt .pn { position:absolute; left:0; top:330px; width:880px; height:360px; border-radius:16px; background:#fff; border:1px solid #e1e8f0; }
  .pt .pn h5 { position:absolute; left:24px; top:20px; font-size:23px; font-weight:800; }
  .pt .pn .it { position:absolute; left:20px; width:840px; height:76px; border-radius:12px; border:1px solid #e1e8f0; }
  .pt .pn .it i { position:absolute; left:16px; top:20px; width:36px; height:36px; border-radius:10px; background:#e8eef6; }
  .pt .pn .it b { position:absolute; left:72px; top:14px; font-size:17px; }
  .pt .pn .it span { position:absolute; left:72px; top:42px; font-size:14px; color:#4b6580; }
  .pt .pn .it a { position:absolute; right:22px; top:26px; font-size:15px; font-weight:800; color:#0d3b66; }
  .stagecard { position:absolute; width:300px; height:150px; border-radius:22px; }
  svg { display:block; }
</style>

<script>
(function(){
  // ---------- deterministic PRNG ----------
  function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
  var rnd = mulberry(20260);
  var R = function(a,b){return a+(b-a)*rnd();};

  // ---------- helpers ----------
  function el(html){var d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
  function add(parent,html,style,cls){
    var e=el(html); if(style) e.style.cssText+=';'+style; if(cls) e.className+=' '+cls; parent.appendChild(e); return e;
  }
  function box(parent,cls,style,inner){ var d=document.createElement('div'); d.className=cls||''; d.style.cssText='position:absolute;'+(style||''); if(inner) d.innerHTML=inner; parent.appendChild(d); return d; }

  // Asian professional vector avatar
  function person(o){
    var skin=o.skin||'#f0c8a0', sd=o.skinD||'#dba67f', hair=o.hair||'#15151c', shirt=o.shirt||'#1d3b66', fem=!!o.fem, gl=!!o.glasses, tie=o.tie;
    var back = fem ? '<path d="M56 112 C44 48 156 48 144 112 L152 196 L48 196Z" fill="'+hair+'"/>' : '';
    var front = fem
      ? '<path d="M62 108 C60 62 84 52 102 52 C128 52 142 70 138 108 C128 84 112 74 98 76 C82 76 68 88 62 108Z" fill="'+hair+'"/>'
      : '<path d="M60 106 C54 56 82 46 102 46 C130 46 148 62 140 106 C136 86 124 76 104 74 C86 74 68 82 60 106Z" fill="'+hair+'"/>';
    var glasses = gl ? '<g fill="none" stroke="#222a38" stroke-width="3"><rect x="70" y="102" width="26" height="20" rx="8"/><rect x="104" y="102" width="26" height="20" rx="8"/><path d="M96 111h8"/></g>' : '';
    var tieSvg = tie ? '<path d="M100 182l-7 12 7 30 7-30z" fill="'+tie+'"/>' : '';
    return '<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">'
      + back
      + '<path d="M14 250 C14 196 56 178 100 178 C144 178 186 196 186 250Z" fill="'+shirt+'"/>'
      + '<path d="M84 178 L100 206 L116 178Z" fill="#f4f7fb"/>' + tieSvg
      + '<rect x="87" y="148" width="26" height="34" rx="10" fill="'+sd+'"/>'
      + '<ellipse cx="100" cy="112" rx="38" ry="46" fill="'+skin+'"/>'
      + '<ellipse cx="62" cy="116" rx="5" ry="9" fill="'+skin+'"/><ellipse cx="138" cy="116" rx="5" ry="9" fill="'+skin+'"/>'
      + front
      + '<path d="M76 100 q8 -5 17 -1 M107 99 q9 -4 17 1" stroke="#15151c" stroke-width="3.2" fill="none" stroke-linecap="round"/>'
      + '<ellipse cx="84" cy="113" rx="6.4" ry="2.8" fill="#1a1a22"/><ellipse cx="116" cy="113" rx="6.4" ry="2.8" fill="#1a1a22"/>'
      + glasses
      + '<path d="M100 118 q-3 9 2 11" stroke="'+sd+'" stroke-width="2.6" fill="none" stroke-linecap="round"/>'
      + '<path d="M86 136 Q100 148 114 136" stroke="#b4574c" stroke-width="3.6" fill="none" stroke-linecap="round"/>'
      + '<ellipse cx="74" cy="132" rx="8" ry="4" fill="#ff8f8f" opacity=".28"/><ellipse cx="126" cy="132" rx="8" ry="4" fill="#ff8f8f" opacity=".28"/>'
      + '</svg>';
  }
  var P = {
    hr:     {fem:true,  shirt:'#0e4471', skin:'#f1cba6', skinD:'#dcab85'},
    hrM:    {fem:false, shirt:'#16365c', skin:'#eebf95', skinD:'#d6a077', tie:'#1e8fff', glasses:true},
    c1:     {fem:true,  shirt:'#2a6fb5', skin:'#f3d0ac', skinD:'#deb089'},
    c2:     {fem:false, shirt:'#3b4f73', skin:'#ecc196', skinD:'#d4a278'},
    c3:     {fem:true,  shirt:'#1f5f8b', skin:'#efc59d', skinD:'#d9a77f', hair:'#241a1a'},
    c4:     {fem:false, shirt:'#244e7a', skin:'#f0c9a2', skinD:'#d9a981', glasses:true},
    m1:     {fem:true,  shirt:'#0e4471', skin:'#f2cda8', skinD:'#ddb08a'},
    m2:     {fem:false, shirt:'#1a3a60', skin:'#edc29a', skinD:'#d5a47c', tie:'#4fe3ff'}
  };
  function av(parent,k,x,y,w,extra){
    var h=w*1.25; var d=box(parent,'av','left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;'+(extra||''),person(P[k])); return d;
  }
  function badge(parent,k,x,y,w,ring){ // circular headshot
    var d=box(parent,'bd','left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+w+'px;border-radius:50%;overflow:hidden;background:linear-gradient(160deg,#9fd0ff,#2a6fb5);border:3px solid '+(ring||'#4fe3ff')+';');
    box(d,'', 'left:'+(-w*0.0)+'px;top:'+(w*0.06)+'px;width:'+w+'px;height:'+(w*1.25)+'px;',person(P[k])); return d;
  }
  // Smile mascot (placeholder illustration; replace with official artwork)
  function mascot(parent,x,y,w){
    var s='<svg viewBox="0 0 240 280" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">'
     +'<defs><linearGradient id="mb'+x+y+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe6ff"/></linearGradient>'
     +'<linearGradient id="mv'+x+y+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b4f9c"/><stop offset="1" stop-color="#06193a"/></linearGradient></defs>'
     +'<line x1="120" y1="22" x2="120" y2="52" stroke="#2f8bff" stroke-width="6" stroke-linecap="round"/><circle cx="120" cy="16" r="12" fill="#6fd5ff"/><circle cx="120" cy="16" r="5" fill="#fff"/>'
     +'<rect x="8" y="104" width="30" height="62" rx="15" fill="#1e8fff"/><rect x="202" y="104" width="30" height="62" rx="15" fill="#1e8fff"/>'
     +'<rect x="26" y="50" width="188" height="154" rx="70" fill="url(#mb'+x+y+')" stroke="#a9ccf5" stroke-width="3"/>'
     +'<rect x="44" y="72" width="152" height="110" rx="50" fill="url(#mv'+x+y+')"/>'
     +'<path d="M72 126 Q88 100 104 126" stroke="#5fe3ff" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M136 126 Q152 100 168 126" stroke="#5fe3ff" stroke-width="9" fill="none" stroke-linecap="round"/>'
     +'<path d="M96 152 Q120 172 144 152" stroke="#5fe3ff" stroke-width="8" fill="none" stroke-linecap="round"/>'
     +'<rect x="70" y="204" width="100" height="62" rx="26" fill="url(#mb'+x+y+')" stroke="#a9ccf5" stroke-width="3"/><rect x="104" y="222" width="32" height="26" rx="9" fill="#1e8fff"/>'
     +'</svg>';
    return box(parent,'mascot','left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+(w*1.1667)+'px;filter:drop-shadow(0 0 30px rgba(79,227,255,.6));',s);
  }
  function resume(parent,x,y,w,rot,k){
    var h=w*1.3;
    var d=box(parent,'paper rs','left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;transform:rotate('+rot+'deg);');
    var s=w/180;
    box(d,'','left:'+14*s+'px;top:'+14*s+'px;width:'+44*s+'px;height:'+44*s+'px;border-radius:6px;background:#bcd3ea;overflow:hidden;',person(P[k||'c1']));
    box(d,'bar','left:'+68*s+'px;top:'+20*s+'px;width:'+90*s+'px;height:'+9*s+'px;background:#0e4471');
    box(d,'bar','left:'+68*s+'px;top:'+38*s+'px;width:'+60*s+'px;height:'+7*s+'px');
    for(var i=0;i<6;i++) box(d,'bar','left:'+14*s+'px;top:'+(76+i*17)*s+'px;width:'+(i%3==2?100:152)*s+'px;height:'+7*s+'px');
    return d;
  }
  function dash(parent,scale,x,y,cls){
    var L=box(parent,'lap '+(cls||''),'left:'+x+'px;top:'+y+'px;transform-origin:50% 50%;');
    var nav=['Dashboard','Role Requests','Resume Screening','Applicants','Interview Calendar','Settings','Credits','User Accounts'];
    var kp=[['ROLE REVIEWS','Waiting for HR review'],['RESUME REVIEWS','Candidates awaiting review'],['VOICE REVIEWS','Completed calls to review'],['AVATAR REVIEWS','Completed avatars to review'],['OPEN ALERTS','Issues needing follow-up']];
    L.innerHTML='<div class="lid"><div class="scr" style="background:#f4f7fb"><div class="pt">'
     +'<div class="sb"><div class="brand"><img src="assets/logo.png"><b>SMILE</b><i>Recruitment Portal</i></div>'
     +nav.map(function(n,i){return '<div class="nav'+(i==0?' on':'')+'" style="top:'+(104+i*52)+'px">'+n+'</div>'}).join('')+'</div>'
     +'<div class="mn"><h4>Welcome back</h4><div class="ps">Here’s what needs your attention today.</div>'
     +'<div class="btn" style="right:150px;background:#0d3b66;color:#fff">+ Create Role Request</div><div class="btn" style="right:0;background:#fff;color:#0d3b66;border:1px solid #d3deea">Refresh</div>'
     +kp.map(function(k,i){return '<div class="kp" style="left:'+(i*178)+'px"><span>'+k[0]+'</span><b class="n'+(i+1)+'">0</b><em>'+k[1]+'</em><u>Needs action</u></div>'}).join('')
     +'<div class="pn"><h5>What Needs Your Attention</h5>'
     +[['Role requests need review','A hiring request is waiting for an HR decision.','Review requests →'],['Candidates need resume review','Review the application and decide whether it should move forward.','Review candidates →'],['Voice interview reviews are waiting','A completed call interview is ready for HR review.','Review voice interviews →']].map(function(r,i){return '<div class="it" style="top:'+(64+i*88)+'px"><i></i><b>'+r[0]+'</b><span>'+r[1]+'</span><a>'+r[2]+'</a></div>'}).join('')
     +'</div></div></div></div></div><div class="base"></div>';
    L.style.transform='scale('+scale+')';
    return L;
  }
  function fx(sel,from,to,at,dur,ease){ // generic from-to
    to=Object.assign({duration:dur||0.7,ease:ease||'power3.out'},to); tl.fromTo(sel,from,to,at);
  }
  var tl = gsap.timeline({paused:true});
  var $=function(s){return document.querySelector(s)};
  var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};

  // ---------- global background ----------
  var bg=$('#bgwrap');
